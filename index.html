<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VLUGGE JAPIE | Jaap Schuurmans</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              brand: {
                black: '#111111',
                dark: '#1A1A1A',
                gray: '#2A2A2A',
                accent: '#E65100', // Industrial Orange
                light: '#F5F5F5'
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #111111;
        color: #F5F5F5;
      }
      .glass-panel {
        background: rgba(42, 42, 42, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* PRINT STYLES FOR PDF GENERATION */
      @media print {
        @page {
          margin: 10mm;
          size: A4;
        }
        body {
          background-color: white !important;
          color: black !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        #root {
          width: 100%;
          margin: 0;
          padding: 0;
        }
        header, .no-print, button, .animate-fade-in {
          display: none !important;
        }
        .glass-panel {
          background: none !important;
          border: 1px solid #ddd !important;
          color: black !important;
          box-shadow: none !important;
          break-inside: avoid;
          margin-bottom: 20px;
        }
        .text-white { color: black !important; }
        .text-gray-300, .text-gray-400, .text-gray-500 { color: #444 !important; }
        .text-brand-accent { color: #E65100 !important; font-weight: bold; }
        .bg-brand-dark\/80 { background: none !important; border: 1px solid #eee; }
        .bg-black\/20 { background: #f5f5f5 !important; }
        .border-white\/10, .border-white\/5 { border-color: #ddd !important; }
        
        /* Ensure layout works on paper */
        .grid { display: block !important; }
        .col-span-2 { width: 100% !important; }
        .summary-grid {
          display: grid !important;
          grid-template-columns: repeat(4, 1fr) !important;
          gap: 10px;
          margin-bottom: 20px;
        }
        h2, h3, h4 { page-break-after: avoid; color: black !important; }
        img { max-width: 100% !important; height: auto !important; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
